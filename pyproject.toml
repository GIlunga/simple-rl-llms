
[project]
name = "simple-rl-for-llms"
version = "0.1.0"
description = "A collection of training scripts for implementing reinforcement learning algorithms (GRPO, PPO, REINFORCE) to fine-tune large language models, built from scratch for educational purposes."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "transformers>=5,<6",
    "gem-llm==0.1.0",
    "torch>=2.7.0",
    "wandb>=0.23.1",
    "accelerate>1,<2",
    "modal>=1.4.2",
    "causal-conv1d",
    "flash-linear-attention[cuda]>=0.5,<0.6",
    "wandb==0.28.1"
]

[dependency-groups]
cuda = [
    "accelerate>=1.13.0",
]
dev = [
    "pytest>=8.4.2",
    "ruff>=0.14.0",
]

[tool.uv]
# Disable isolation strictly for causal-conv1d
no-build-isolation-package = ["causal-conv1d"]

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch" }

[tool.ruff]
line-length = 120
target-version = "py312"
